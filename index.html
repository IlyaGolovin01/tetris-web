<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Tetris</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="topbar">
        <div>
            <div class="logo">TETRIS</div>
            <div class="subtitle">Telegram Mini App</div>
        </div>

        <button id="pauseBtn" class="icon-btn">
            ⏸
        </button>
    </header>

    <section class="stats">

        <div class="stat">
            <span>СЧЁТ</span>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <span>ЛИНИИ</span>
            <strong id="lines">0</strong>
        </div>

        <div class="stat">
            <span>УРОВЕНЬ</span>
            <strong id="level">1</strong>
        </div>

        <div class="stat">
            <span>РЕКОРД</span>
            <strong id="highScore">0</strong>
        </div>

    </section>

    <main class="game-area">

        <div class="board-wrapper">

            <canvas id="gameCanvas"></canvas>

            <div id="gameOver" class="overlay hidden">
                <div class="overlay-card">
                    <div class="overlay-title">ИГРА ОКОНЧЕНА</div>

                    <div class="final-score">
                        <span>Счёт</span>
                        <strong id="finalScore">0</strong>
                    </div>

                    <button id="restartBtn" class="main-btn">
                        ИГРАТЬ СНОВА
                    </button>
                </div>
            </div>

            <div id="pauseOverlay" class="overlay hidden">
                <div class="overlay-card">
                    <div class="overlay-title">ПАУЗА</div>

                    <button id="resumeBtn" class="main-btn">
                        ПРОДОЛЖИТЬ
                    </button>
                </div>
            </div>

        </div>

    </main>

    <section class="controls">

        <button class="control-btn" data-action="left">
            ←
        </button>

        <button class="control-btn" data-action="rotate">
            ↻
        </button>

        <button class="control-btn drop" data-action="drop">
            ↓
        </button>

        <button class="control-btn" data-action="right">
            →
        </button>

    </section>

    <section class="mobile-extra">

        <button class="wide-btn" data-action="hardDrop">
            ⬇ БЫСТРО СБРОСИТЬ
        </button>

    </section>

    <footer>
        TETRIS • TELEGRAM MINI APP
    </footer>

</div>

<script src="game.js"></script>

</body>
</html>
